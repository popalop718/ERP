# XcodeGen spec — run `xcodegen generate` in this folder to create DuoKeyboard.xcodeproj.
# Change BUNDLE_PREFIX to your own reverse-DNS prefix and set DEVELOPMENT_TEAM (or pick
# your team in Xcode → Signing & Capabilities) before building to a device.
name: DuoKeyboard
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_PREFIX: com.example
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  DuoKeyboard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Duo Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: group.$(BUNDLE_PREFIX).duokeyboard
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/DuoKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).duokeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).duokeyboard
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: DuoKeyboardExtension
        embed: true

  DuoKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - "Resources/**"
      - path: Keyboard/Resources
        buildPhase: resources
      - path: Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Duo Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: group.$(BUNDLE_PREFIX).duokeyboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/DuoKeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).duokeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).duokeyboard.keyboard
        PRODUCT_NAME: DuoKeyboardExtension
        APPLICATION_EXTENSION_API_ONLY: YES
